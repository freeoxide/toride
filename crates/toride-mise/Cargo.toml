[package]
name = "toride-mise"
version.workspace = true
edition.workspace = true
description = "Typed mise integration: query tool versions, config files, and environment state"
license.workspace = true
repository.workspace = true

[features]
default = ["json", "toml", "diagnostics"]
json = ["dep:serde", "dep:serde_json"]
toml = ["dep:toml", "dep:toml_edit"]
diagnostics = []
tracing = ["dep:tracing"]
bootstrap = ["dep:reqwest", "dep:flate2", "dep:tar", "dep:sha2"]
miette = ["dep:miette"]
blocking = []

[dependencies]
toride-runner = { path = "../toride-runner", version = "0.1.0", features = ["tokio-runner", "stream", "fake"] }
# Offline detection of the mise binary ($PATH + the managed install
# location). `default-features = false` keeps the installer's HTTP/archive
# engine out of this crate's graph: no reqwest (rustls -> ring), no xz2
# (lzma-sys) — the C build scripts that keep toride-mise on CI's portable
# macOS/Windows lists.
toride-installer = { path = "../toride-installer", version = "0.1.0", default-features = false }
thiserror = { workspace = true }
camino = { workspace = true }
fs-err = { workspace = true }
semver = { workspace = true }
dirs = { workspace = true }
# `spawn_blocking` in `MiseBinary::discover_async`: the detector's version
# probes are sync subprocess work and must not run on an async runtime
# worker. Already in every graph via toride-runner/toride-installer.
tokio = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
miette = { version = "7", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
insta = { workspace = true }
tokio = { workspace = true }
toride-runner = { path = "../toride-runner", version = "0.1.0", features = ["tokio-runner", "stream", "fake", "duct-runner"] }

[lints]
workspace = true
