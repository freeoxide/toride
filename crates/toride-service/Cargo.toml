[package]
name = "toride-service"
version.workspace = true
edition.workspace = true
description = "Shared systemd service management utilities"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["systemd", "service", "systemctl", "daemon", "unit"]
categories = ["os"]

[features]
default = ["client"]
client = ["dep:duct"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
toride-runner = { path = "../toride-runner", version = "0.2.0" }
toride-fs = { path = "../toride-fs", version = "0.2.0" }
duct = { version = "1", features = ["timeout"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
insta = "1"
tempfile = "3"
proptest = "1"
toride-runner = { path = "../toride-runner", version = "0.2.0", features = ["fake"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "deploy_unit"
harness = false

[lints]
workspace = true
