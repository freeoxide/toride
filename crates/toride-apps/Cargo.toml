[package]
name = "toride-apps"
version.workspace = true
edition.workspace = true
description = "App install/uninstall execution layer: plans registry `App`s into concrete backend operations (homebrew, flatpak, distro) and runs them through the shared runner seam."
license.workspace = true
repository.workspace = true

[features]
default = ["tokio"]
# Runtime offloading for the async facade: `spawn_blocking` dispatch of
# backend commands and manifest saves. Without it the crate builds with no
# tokio dependency at all — the sync execution path
# (`Backend::*_sync`, `AppsBlocking`) is then the supported surface, and
# async dispatch runs commands on the calling thread.
tokio = ["dep:tokio"]

[dependencies]
tokio = { workspace = true, optional = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
camino = { workspace = true }
# Host home/data dir resolution for backend detection (A2+); declared now so
# the A1 dep surface is stable for the backend rounds.
dirs = { workspace = true }
# All external command execution flows through the workspace's shared
# `Runner` seam (cf. toride-mise's builder injection pattern): sync
# `duct-runner` by default, a `FakeRunner` in tests. The dep/dev-dep split
# keeps the test-only `fake` feature out of the normal build, mirroring
# toride-installer's split.
toride-runner = { path = "../toride-runner", version = "0.1.0", features = ["duct-runner"] }
# The planner consumes the normalized `App`/`InstallMethod` contract, and
# the facade round (A6) resolves apps through the registry's adapters — so
# the workspace default (the `http` fetch engine) is taken deliberately.
toride-registry = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
toride-runner = { path = "../toride-runner", version = "0.1.0", features = ["fake"] }

[lints]
workspace = true
