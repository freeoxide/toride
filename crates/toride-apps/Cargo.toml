[package]
name = "toride-apps"
version.workspace = true
edition.workspace = true
description = "App install/uninstall execution layer: plans registry `App`s into concrete backend operations (homebrew, flatpak, distro) and runs them through the shared runner seam."
license.workspace = true
repository.workspace = true

[features]
default = []
# spawn_blocking offloading for the async facade (see lib.rs for the
# full story); the sync surface needs neither it nor tokio.
tokio = ["dep:tokio"]
# Opt in to the registry's fetch engine (reqwest + gzip + tokio): the
# concrete source adapters a caller can register with `Apps::adapter`.
registry-http = ["toride-registry/http"]

[dependencies]
tokio = { workspace = true, optional = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
camino = { workspace = true }
# Host home/data dir resolution for backend detection (A2+); declared now so
# the A1 dep surface is stable for the backend rounds.
dirs = { workspace = true }
# All external command execution flows through the workspace's shared
# `Runner` seam (cf. toride-mise's builder injection pattern): sync
# `duct-runner` by default, a `FakeRunner` in tests. The dep/dev-dep split
# keeps the test-only `fake` feature out of the normal build, mirroring
# toride-installer's split.
toride-runner = { path = "../toride-runner", version = "0.1.0", features = ["duct-runner"] }
# Registry parse half only by default (no reqwest, no tokio); the
# `registry-http` feature opts its fetch engine back in. Declared
# directly: cargo allows `default-features` only on the declaring manifest.
toride-registry = { path = "../toride-registry", version = "0.1.0", default-features = false }

[dev-dependencies]
tokio = { workspace = true }
toride-runner = { path = "../toride-runner", version = "0.1.0", features = ["fake"] }

[lints]
workspace = true
