[package]
name = "toride-apps"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
description = "App install/uninstall execution layer: plans registry `App`s into concrete backend operations (homebrew, flatpak, distro) and runs them through the shared runner seam."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["package-manager", "homebrew", "flatpak", "apt", "dnf"]
categories = ["development-tools", "os"]

[features]
default = []
# spawn_blocking offloading for the async facade (see lib.rs for the
# full story); the sync surface needs neither it nor tokio.
tokio = ["dep:tokio"]
# Opt in to the registry's fetch engine (reqwest + gzip + tokio): the
# concrete source adapters a caller can register with `Apps::adapter`.
registry-http = ["toride-registry/http"]
# Opt in to direct-download installs over toride-installer's verified
# pipeline (plan 3.5). Pulls tokio and reqwest/xz2 (the engine is async),
# so it stays off the default set: the default graph remains tokio-free.
direct = ["dep:toride-installer", "tokio"]
# mise installs delegate to toride-mise, whose client needs an async
# runtime — this feature carries that tokio cost; npm/cargo/pipx/uv
# routing stays default-feature and tokio-free.
mise = ["dep:toride-mise", "toride-runner/tokio-runner"]

[dependencies]
tokio = { workspace = true, optional = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
camino = { workspace = true }
# Host home/data dir resolution for backend detection (A2+); declared now so
# the A1 dep surface is stable for the backend rounds.
dirs = { workspace = true }
# All external command execution flows through the workspace's shared
# `Runner` seam (cf. toride-mise's builder injection pattern): sync
# `duct-runner` by default, a `FakeRunner` in tests. The dep/dev-dep split
# keeps the test-only `fake` feature out of the normal build, mirroring
# toride-installer's split.
toride-runner = { path = "../toride-runner", version = "0.1.0", features = ["duct-runner"] }
# Registry parse half only by default (no reqwest, no tokio); the
# `registry-http` feature opts its fetch engine back in. Declared
# directly: cargo allows `default-features` only on the declaring manifest.
toride-registry = { path = "../toride-registry", version = "0.1.0", default-features = false }
# Direct-download installs (the `direct` feature) execute through
# toride-installer's verified pipeline: capped download, sha256 check,
# tar.gz/tar.xz extraction, atomic 0o755 install write.
toride-installer = { path = "../toride-installer", version = "0.1.0", optional = true, default-features = false, features = ["http"] }
toride-mise = { path = "../toride-mise", version = "0.1.0", optional = true }

[dev-dependencies]
tokio = { workspace = true }
toride-runner = { path = "../toride-runner", version = "0.1.0", features = ["fake"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[lints]
workspace = true
