[package]
exclude = ["benches/fixtures/**"]
name = "toride-proxy"
version.workspace = true
edition.workspace = true
description = "Reverse proxy, TLS certificate, and WAF management"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["reverse-proxy", "nginx", "caddy", "tls", "certificate"]
categories = ["network-programming", "os"]

[[bin]]
name = "toride-proxy"
path = "src/main.rs"
required-features = ["cli"]

## The lib carries no `#[bench]` functions; criterion owns every `[[bench]]`
## target. Disabling the lib bench target keeps `cargo bench -- <criterion
## args>` from forwarding those args to the libtest harness, which does not
## understand them.
[lib]
bench = false

[features]
## `config` and `waf` are default so the criterion benches that measure them
## (site_apply, waf_evaluate) build under the plain workspace bench
## invocation; both reuse deps the default set already pulls in (regex,
## client).
default = ["client", "doctor", "nginx", "config", "waf"]

# === Capability features ===

## Proxy client wrapper, command execution via duct, service management.
client = ["dep:duct"]

## Diagnostic engine for proxy installations.
doctor = ["service"]

## Service management for proxy units (systemctl through the shared runner).
service = ["client"]

## Nginx reverse proxy configuration and management.
## Site enable/disable uses the shared hardened link primitives in
## `site_links`, so this feature does not need to imply `config`.
nginx = ["client", "dep:regex"]

## Caddy reverse proxy configuration and management.
caddy = ["client"]

## TLS certificate lifecycle management.
certs = ["client"]

## Web Application Firewall stub.
waf = ["dep:regex"]

## Configuration file parsing and rendering.
config = ["client", "dep:regex"]

## Serialize/Deserialize on types.
serde = ["dep:serde", "dep:serde_json"]

## CLI argument parsing.
cli = ["dep:clap", "client", "doctor", "nginx"]

[dependencies]
# --- Always required ---
toride-runner = { path = "../toride-runner", version = "0.2.0" }
toride-fs = { path = "../toride-fs", version = "0.2.0" }
toride-diagnostic-types = { path = "../toride-diagnostic-types", version = "0.2.0" }
thiserror = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }

# --- Optional (feature-gated) ---
duct = { version = "1", features = ["timeout"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
regex = { version = "1", optional = true }
similar = "2"
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
toride-runner = { path = "../toride-runner", version = "0.2.0", features = ["fake", "duct-runner"] }
insta = "1"
tempfile = "3"
assert_fs = "1"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "cert_scan"
harness = false

[[bench]]
name = "site_apply"
harness = false
required-features = ["config"]

[[bench]]
name = "waf_evaluate"
harness = false
required-features = ["waf"]

[[bench]]
name = "nginx_parse"
harness = false

[[bench]]
name = "diff_blocks"
harness = false

[lints]
workspace = true
