[package]
name = "toride-status"
version.workspace = true
edition.workspace = true
description = "Point-in-time host status snapshots: OS metrics, daemon liveness, and SSH health"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["status", "metrics", "system", "monitoring", "snapshot"]
categories = ["os"]

[lib]
name = "toride_status"
path = "src/lib.rs"
bench = false

[features]
# `sysinfo` is the only metrics backend; there are no backend-alternative
# features to toggle.
default = ["battery"]
battery = ["starship-battery"]

[dependencies]
sysinfo = "0.35"
sysconf = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }
nix = { version = "0.31", features = ["user", "signal", "fs"] }
dirs = { workspace = true }
toride-runner = { path = "../toride-runner", version = "0.2.0", features = ["duct-runner", "fake"] }
toride-fs = { path = "../toride-fs", version = "0.2.0" }
toride-diagnostic-types = { path = "../toride-diagnostic-types", version = "0.2.0" }

# Optional dependencies
starship-battery = { version = "0.8", optional = true }

[dev-dependencies]
insta = "1"
tempfile = "3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "prune_slow_proc_cache"
harness = false

[[bench]]
name = "collect_cycle"
harness = false

[lints]
workspace = true
