[package]
name = "toride-ssh"
version.workspace = true
edition.workspace = true
description = "Async SSH manager library: a unified facade over the toride-ssh key, config, agent, known-hosts, authorized-keys, doctor, forward, and certificate sub-crates"
license.workspace = true
repository.workspace = true

[features]
default = [
    "agent", "known-hosts", "authorized-keys",
    "doctor", "forward",
]

# Subsystem features — each simply enables the corresponding sub-crate dep.
agent = ["dep:toride-ssh-agent"]
known-hosts = ["dep:toride-ssh-known-hosts"]
authorized-keys = ["dep:toride-ssh-authorized-keys"]
doctor = ["dep:toride-ssh-doctor"]
forward = ["dep:toride-ssh-forward"]
certificate = ["dep:toride-ssh-certificate"]

# Convenience: enable everything
full = [
    "agent", "known-hosts", "authorized-keys",
    "doctor", "forward", "certificate",
]

[dependencies]
toride-ssh-core = { path = "crates/core", version = "0.1.0" }
toride-ssh-config = { path = "crates/config", version = "0.1.0" }
toride-ssh-key = { path = "crates/key", version = "0.1.0" }
toride-ssh-agent = { path = "crates/agent", version = "0.1.0", optional = true }
toride-ssh-known-hosts = { path = "crates/known-hosts", version = "0.1.0", optional = true }
toride-ssh-authorized-keys = { path = "crates/authorized-keys", version = "0.1.0", optional = true }
toride-ssh-doctor = { path = "crates/doctor", version = "0.1.0", optional = true }
toride-ssh-forward = { path = "crates/forward", version = "0.1.0", optional = true }
toride-ssh-certificate = { path = "crates/certificate", version = "0.1.0", optional = true }
tokio = { workspace = true, features = ["process", "fs", "rt", "sync"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
