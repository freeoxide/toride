[package]
name = "toride-ssh"
version.workspace = true
edition.workspace = true
description = "Async SSH manager library: a unified facade over the toride-ssh key, config, agent, known-hosts, authorized-keys, doctor, forward, certificate, exec, and upload sub-crates"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ssh", "openssh", "async", "keys", "remote-access"]
categories = ["network-programming", "authentication", "asynchronous"]

[features]
default = [
    "agent", "known-hosts", "authorized-keys",
    "doctor", "forward",
]

agent = ["dep:toride-ssh-agent"]
known-hosts = ["dep:toride-ssh-known-hosts"]
authorized-keys = ["dep:toride-ssh-authorized-keys"]
doctor = ["dep:toride-ssh-doctor"]
forward = ["dep:toride-ssh-forward"]
certificate = ["dep:toride-ssh-certificate"]
exec = ["dep:toride-ssh-exec", "dep:toride-runner"]
upload = ["dep:toride-ssh-upload", "dep:toride-runner"]

full = [
    "agent", "known-hosts", "authorized-keys",
    "doctor", "forward", "certificate", "exec", "upload",
]

[dependencies]
toride-ssh-core = { path = "crates/core", version = "0.2.0" }
toride-ssh-config = { path = "crates/config", version = "0.2.0" }
toride-ssh-key = { path = "crates/key", version = "0.2.0" }
toride-ssh-agent = { path = "crates/agent", version = "0.2.0", optional = true }
toride-ssh-known-hosts = { path = "crates/known-hosts", version = "0.2.0", optional = true }
toride-ssh-authorized-keys = { path = "crates/authorized-keys", version = "0.2.0", optional = true }
toride-ssh-doctor = { path = "crates/doctor", version = "0.2.0", optional = true }
toride-ssh-forward = { path = "crates/forward", version = "0.2.0", optional = true }
toride-ssh-certificate = { path = "crates/certificate", version = "0.2.0", optional = true }
toride-ssh-exec = { path = "crates/exec", version = "0.2.0", optional = true }
toride-ssh-upload = { path = "crates/upload", version = "0.2.0", optional = true }
toride-runner = { path = "../toride-runner", version = "0.2.0", optional = true }
tokio = { workspace = true, features = ["process", "fs", "rt", "sync"] }

[dev-dependencies]
tempfile = "3"
toride-runner = { path = "../toride-runner", version = "0.2.0", features = ["fake"] }

[[test]]
name = "vps"
required-features = ["exec", "upload"]

[lints]
workspace = true
