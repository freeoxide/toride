[package]
name = "toride-ssh-certificate"
version.workspace = true
edition.workspace = true
description = "SSH certificate authority and key revocation list (KRL) inspection"
license.workspace = true
repository.workspace = true

[dependencies]
toride-ssh-core = { path = "../core", version = "0.1.0" }
tokio = { workspace = true, features = ["process", "fs", "rt", "sync"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "rsa", "p256", "crypto", "std"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
