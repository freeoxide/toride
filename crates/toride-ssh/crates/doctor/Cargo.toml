[package]
name = "toride-ssh-doctor"
version.workspace = true
edition.workspace = true
description = "SSH environment diagnostics: local and remote doctor checks for permissions, keys, agent, config, and connectivity"
license.workspace = true
repository.workspace = true

[dependencies]
toride-ssh-core = { path = "../core", version = "0.1.0" }
toride-ssh-config = { path = "../config", version = "0.1.0" }
tokio = { workspace = true, features = ["process", "fs", "rt", "sync"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
duct = "1"
libc = "0.2"
base64 = "0.22"
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "rsa", "p256", "crypto", "std"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[lints]
workspace = true
