[package]
name = "toride-ssh-authorized-keys"
version.workspace = true
edition.workspace = true
description = "authorized_keys file management: listing, adding, removing, and querying entries"
license.workspace = true
repository.workspace = true

[dependencies]
toride-ssh-core = { path = "../core", version = "0.1.0" }
toride-fs = { path = "../../../toride-fs", version = "0.1.0" }
tokio = { workspace = true, features = ["process", "fs", "rt", "sync"] }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "rsa", "p256", "crypto", "std"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
