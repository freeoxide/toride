[package]
name = "toride-ssh-known-hosts"
version.workspace = true
edition.workspace = true
description = "Known-hosts file parsing and host-key change detection"
license.workspace = true
repository.workspace = true

[dependencies]
toride-ssh-core = { path = "../core", version = "0.1.0" }
tokio = { workspace = true, features = ["process", "fs", "rt", "sync"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
duct = "1"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "rsa", "std"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
