[package]
name = "toride-ssh-upload"
version.workspace = true
edition.workspace = true
description = "One-shot file upload to remote hosts via sftp batch mode with a validated remote path type"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ssh", "sftp", "upload", "file-transfer", "security"]
categories = ["network-programming"]

[dependencies]
toride-ssh-core = { path = "../core", version = "0.2.0" }
toride-runner = { path = "../../../toride-runner", version = "0.2.0" }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
toride-runner = { path = "../../../toride-runner", version = "0.2.0", features = ["fake"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "upload_stage_overhead"
harness = false

[lints]
workspace = true
