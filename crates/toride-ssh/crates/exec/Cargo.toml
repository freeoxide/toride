[package]
name = "toride-ssh-exec"
version.workspace = true
edition.workspace = true
description = "Remote command execution over ssh with argv-disciplined invocation and typed host-key failures"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ssh", "remote-execution", "argv", "security", "hardening"]
categories = ["network-programming"]

[dependencies]
toride-ssh-core = { path = "../core", version = "0.2.0" }
toride-runner = { path = "../../../toride-runner", version = "0.2.0" }
thiserror = { workspace = true }

[dev-dependencies]
toride-runner = { path = "../../../toride-runner", version = "0.2.0", features = ["fake"] }

[lints]
workspace = true
