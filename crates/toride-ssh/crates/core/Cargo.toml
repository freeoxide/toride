[package]
name = "toride-ssh-core"
version.workspace = true
edition.workspace = true
description = "Shared types, errors, path resolution, CLI runner abstraction, and undo mechanism for the toride-ssh sub-crates"
license.workspace = true
repository.workspace = true

[dependencies]
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "rsa", "p256", "crypto", "std"] }
tokio = { workspace = true, features = ["process", "fs", "rt", "sync"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
which = { workspace = true }
async-trait = { workspace = true }
toride-fs = { path = "../../../toride-fs", version = "0.1.0" }
toride-runner = { path = "../../../toride-runner", version = "0.1.0", features = ["tokio-runner", "fake"] }
toride-diagnostic-types = { path = "../../../toride-diagnostic-types", version = "0.1.0" }
duct = "1"
libc = "0.2"
base64 = "0.22"
gethostname = "0.5"
# `tempfile` is a runtime dependency: WriteSshdConfig stages the new
# sshd_config in an O_EXCL, unpredictable-named temp file in the *same
# directory* as the target (so the install is an atomic rename within one
# filesystem, and `sshd -t` resolves relative `Include` directives correctly).
tempfile = { workspace = true }

[lints]
workspace = true
