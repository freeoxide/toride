[package]
name = "toride-ssh-agent"
version.workspace = true
edition.workspace = true
description = "SSH agent management: listing, adding, and removing keys"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ssh", "agent", "ssh-agent", "keys", "identity"]
categories = ["authentication", "network-programming"]

[features]
default = []
native = ["dep:ssh-agent-lib"]

[dependencies]
toride-ssh-core = { path = "../core", version = "0.2.0" }
tokio = { workspace = true, features = ["process", "fs", "rt", "sync"] }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
ssh-agent-lib = { version = "0.6", optional = true }
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "rsa", "std"] }
duct = "1"
libc = "0.2"
base64 = "0.22"
zeroize = { workspace = true }

[lib]
# Keeps `cargo bench -- --baseline ...` out of the libtest harness; only the
# criterion [[bench]] target should receive bench args.
bench = false

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "session_fanout"
harness = false

[lints]
workspace = true
