[package]
name = "toride-ssh-config"
version.workspace = true
edition.workspace = true
description = "SSH config file parsing, editing, and host resolution via a lossless AST"
license.workspace = true
repository.workspace = true

[dependencies]
toride-ssh-core = { path = "../core", version = "0.1.0" }
toride-fs = { path = "../../../toride-fs", version = "0.1.0" }
# Used directly only by sshd::edit()'s cross-process edit lock, which must hold
# an exclusive flock guard across an async (load → mutate → save) critical
# section. toride_fs::with_lock exposes a sync closure only (no guard), so it
# cannot span the .await points; we acquire the same advisory lock primitive
# (fd_lock) directly and drop the guard at function exit.
fd-lock = "4"
tokio = { workspace = true, features = ["process", "fs", "rt", "rt-multi-thread", "sync"] }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
ssh2-config-rs = "0.7"
dirs = { workspace = true }
gethostname = "0.5"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true
