[package]
name = "toride-backup"
version.workspace = true
edition.workspace = true
description = "Backup scheduling and management via restic or borg"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "toride_backup"
path = "src/lib.rs"

[[bin]]
name = "toride-backup"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["client", "doctor"]

# === Capability features ===

## restic/borg CLI wrappers, backup operations, restore workflows.
## Implies serde/serde_json so backends can parse restic/borg JSON output.
client = ["dep:duct", "dep:serde", "dep:serde_json"]

## Diagnostic engine for backup installations.
doctor = ["service"]

## Service management layer (systemd timers, cron).
## Implies `client` because service management may need to run commands.
service = ["client"]

## Config parsing, spec validation, retention policy management.
## Implies `client` because config operations use the command runner.
config = ["client", "dep:regex"]

## Serde serialization for specs and reports.
serde = ["dep:serde", "dep:serde_json"]

## CLI argument parsing.
## Implies the full client stack (client/doctor/service/config/serde) so the
## `toride-backup` binary can dispatch every subcommand to a real client call.
cli = ["dep:clap", "client", "doctor", "service", "config", "serde"]

[dependencies]
# --- Always required ---
toride-runner = { path = "../toride-runner", version = "0.1.0", features = ["duct-runner", "fake"] }
toride-fs = { path = "../toride-fs", version = "0.1.0" }
toride-diagnostic-types = { path = "../toride-diagnostic-types", version = "0.1.0" }
dirs = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }
# tempfile is used by the non-test RestoreManager::test_restore path to obtain
# an unpredictable, 0700 restore target (avoids a fixed /tmp path).
tempfile = { workspace = true }

# --- Optional (feature-gated) ---
toride-service = { path = "../toride-service", version = "0.1.0", optional = true }
duct = { version = "1", features = ["timeout"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
regex = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
insta = "1"
assert_fs = "1"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# parse_kernels: the restic/borg output parsers over committed fixtures
# (snapshots text table / check / borg list). Hermetic — no restic/borg
# binaries, no repository access. Builds under plain default features: the
# JSON parse arm needs the non-default `serde` feature and is deliberately
# NOT benched (enabling it would change default build behavior).
[[bench]]
name = "parse_kernels"
harness = false
test = false

[lints]
workspace = true
