[package]
name = "toride-installer"
version.workspace = true
edition.workspace = true
rust-version = "1.91"
description = "Tool-agnostic release-artifact installer framework (pure Rust, reqwest-based). Mise is the wired concrete tool."
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
camino = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
tokio = { workspace = true }
# External commands (version probes) go through the workspace's shared
# `Runner` trait. The dep/dev-dep split keeps the test-only `fake` feature
# out of the normal build — stricter than the single-entry shape other
# consumers use.
toride-runner = { path = "../toride-runner", version = "0.1.0", features = ["duct-runner"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
serde = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
camino = { workspace = true }
serde_json = { workspace = true }
toride-runner = { path = "../toride-runner", version = "0.1.0", features = ["duct-runner", "fake"] }

[lints]
workspace = true
