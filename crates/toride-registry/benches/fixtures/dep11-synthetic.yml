# components shaped like `tests/fixtures/appstream/debian-sid-main-amd64.yml`
# but with entirely invented `org.toride.bench.*` data, sized to keep the
# bench seconds-scale. Deliberately exercises every wire edge the parser
# must tolerate: localized Name/Summary/Description maps (inline + block
# scalars), Releases (quoted, numeric AND string-encoded unix-timestamps),
# Provides.binaries/mediatypes, Developer, Launchable, unknown spec fields
