name: Publish crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify packaging and ordering without uploading"
        type: boolean
        default: true

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PUBLISH_SET: >-
    toride-fs toride-runner toride-installer toride-registry toride-mise
    toride-apps

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish
      - name: Gate the release set
        run: |
          set -euo pipefail
          packages=()
          for crate in $PUBLISH_SET; do
            packages+=(-p "$crate")
          done
          cargo fmt --all -- --check
          cargo clippy "${packages[@]}" --all-targets -- -D warnings
          cargo test "${packages[@]}" --all-targets
          cargo clippy -p toride-apps --all-targets --features mise -- -D warnings
          cargo test -p toride-apps --all-targets --features mise
          cargo check -p toride-apps --no-default-features
          cargo check -p toride-registry -p toride-installer --features http
          cargo check -p toride-apps --features direct,registry-http,tokio
      - name: Check intra-set version requirements match the released version
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json, os, pathlib, sys
          meta = json.loads(pathlib.Path("metadata.json").read_text())
          set_names = "toride-fs toride-runner toride-installer toride-registry toride-mise toride-apps".split()
          by_name = {p["name"]: p for p in meta["packages"] if p["name"] in set_names}
          failed = False
          order = os.environ["PUBLISH_SET"].split()
          pos = {c: i for i, c in enumerate(order)}
          if set(order) != set(set_names):
              print("PUBLISH_SET membership mismatch:", sorted(set(order) ^ set(set_names)))
              failed = True
          for name in order:
              for dep in by_name[name]["dependencies"]:
                  if dep["name"] in set_names and pos.get(dep["name"], len(order)) > pos[name]:
                      print(f"PUBLISH_SET order: {name} precedes its dependency {dep['name']}")
                      failed = True
          versions = {by_name[name]["version"] for name in set_names}
          if len(versions) != 1:
              print("release-set versions disagree:", {n: by_name[n]["version"] for n in set_names})
              failed = True
          for name in set_names:
              version = by_name[name]["version"]
              for dep in by_name[name]["dependencies"]:
                  if dep["name"] in set_names and dep.get("path"):
                      want = f"^{version}"
                      if dep["req"] != want:
                          print(f"{name} requires {dep['name']} {dep['req']!r}, expected {want!r}")
                          failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          dry_run="${{ inputs.dry_run }}"
          user_agent="toride-publish-workflow/0.1 (https://github.com/freeoxide/toride)"

          version_for() {
            python3 -c 'import json,sys; ps=json.load(open("metadata.json"))["packages"]; print(next(p["version"] for p in ps if p["name"]==sys.argv[1]))' "$1"
          }

          # The sparse index — what the next crate's cargo publish resolves
          # against — gates both the skip check and the post-upload wait.
          index_has_version() {
            local crate="$1" version="$2" prefix body
            case ${#crate} in
              1) prefix="1/${crate}" ;;
              2) prefix="2/${crate}" ;;
              3) prefix="3/${crate:0:1}/${crate}" ;;
              *) prefix="${crate:0:2}/${crate:2:2}/${crate}" ;;
            esac
            body=$(curl -sS --max-time 30 -A "$user_agent" \
              "https://index.crates.io/${prefix}") || return 1
            [[ "$body" == *"\"vers\":\"${version}\""* ]]
          }

          wait_until_indexed() {
            local crate="$1" version deadline
            version="$(version_for "$crate")"
            deadline=$((SECONDS + 60))
            until index_has_version "$crate" "$version"; do
              if (( SECONDS >= deadline )); then
                echo "error: ${crate} ${version} absent from the sparse index after 60s" >&2
                return 1
              fi
              sleep 5
            done
          }

          intra_set="$(printf '%s' "$PUBLISH_SET" | tr ' ' '|')"
          for crate in $PUBLISH_SET; do
            version="$(version_for "$crate")"
            if index_has_version "$crate" "$version"; then
              echo "==> ${crate} ${version} already indexed, skipping"
              continue
            fi
            echo "==> publishing ${crate} ${version}"
            if [[ "$dry_run" == "true" ]]; then
              log="$(mktemp)"
              if ! cargo publish --dry-run -p "$crate" 2>&1 | tee "$log"; then
                if grep -qE "no matching package named \`(${intra_set})\` found|failed to select a version for the requirement \`(${intra_set}) = " "$log"; then
                  echo "::warning::publish dry-run order-blocked for ${crate} (intra-set dep not on crates.io at the required version)"
                else
                  echo "error: publish dry-run failed for ${crate} for a reason other than order-blocking" >&2
                  exit 1
                fi
              fi
              rm -f "$log"
              echo "dry run: ${crate} not uploaded"
              continue
            fi
            cargo publish --dry-run -p "$crate"
            cargo publish -p "$crate"
            wait_until_indexed "$crate"
          done

          if [[ "$dry_run" == "true" ]]; then
            echo "dry run complete; re-run with dry_run=false to upload"
          else
            echo "published the plan 3.1 release set"
          fi
      - name: Tag the release
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git config user.name "toride-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          for crate in $PUBLISH_SET; do
            version="$(python3 -c 'import json,sys; ps=json.load(open("metadata.json"))["packages"]; print(next(p["version"] for p in ps if p["name"]==sys.argv[1]))' "$crate")"
            tag="${crate}-v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "tag ${tag} exists, skipping"
              continue
            fi
            git tag "${tag}"
            git push origin "refs/tags/${tag}"
          done
