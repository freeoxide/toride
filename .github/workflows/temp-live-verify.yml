name: Temporary live verify (dispatch only)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  language-ecosystems:
    name: Live smoke (ubuntu host, npm/cargo/uv/pipx/mise)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: live-verify-ubuntu
      - name: Install the managers the runner lacks (uv, pipx, mise)
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx python3-venv
          pipx install uv
          curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm --version
          uv --version
          pipx --version
          mise --version
      - name: Env-gated language live smoke through the facade
        env:
          TORIDE_APPS_INTEGRATION: "1"
        run: cargo test -p toride-apps --test live_smoke --features mise -- --nocapture
      - name: Env-gated read-only network legs (flathub, homebrew, appstream)
        if: ${{ !cancelled() }}
        env:
          TORIDE_APPS_INTEGRATION: "1"
        run: cargo test -p toride-apps --test live --features registry-http -- --nocapture

  debian-apt:
    name: Live verify (debian container, dpkg probes + dep-11 catalog)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:bookworm
    steps:
      - name: Install toolchain (bookworm's rustc predates edition 2024, so rustup)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: live-verify-debian
      - name: Apt suppression-flag check
        run: cargo test -p toride-apps executor_suppression_is_per_manager_and_apk_carries_no_flag
      - name: Env-gated read-only apt-family live legs
        env:
          TORIDE_APPS_INTEGRATION: "1"
        run: cargo test -p toride-apps --test live --features registry-http -- --nocapture

  macos-brew:
    name: Live verify (macos host, brew detect + formulae api, first toride-apps macos compile)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: live-verify-macos
      - name: Env-gated brew legs (real brew on PATH)
        env:
          TORIDE_APPS_INTEGRATION: "1"
        run: cargo test -p toride-apps --test live --features registry-http brew -- --nocapture
