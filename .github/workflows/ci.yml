name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Crates verified to compile per OS by the portability audits and local
  # cross-target checks (x86_64-pc-windows-msvc / aarch64-apple-darwin). Linux
  # runs the whole workspace. The macOS/Windows check+clippy lists exclude only
  # crates whose dependency graphs pull C build scripts (ring, lzma-sys) that
  # cannot be cross-verified on a Linux host; widen toward --workspace as
  # native runner evidence comes in. Space-separated; expanded to -p flags.
  # toride-registry's bench dev-graph (criterion -> alloca, a C build
  # script) also cannot cross-compile from Linux; its --all-targets legs
  # over these lists rest on native macOS/Windows runner green instead.
  PORTABLE_CRATES_MACOS: >-
    toride-apps toride-audit toride-backup toride-cloud toride-diagnostic-types
    toride-fail2ban toride-fs toride-harden toride-installer toride-mise
    toride-proxy toride-registry toride-runner toride-service toride-ssh
    toride-ssh-agent
    toride-ssh-authorized-keys toride-ssh-certificate toride-ssh-config
    toride-ssh-core toride-ssh-doctor toride-ssh-forward toride-ssh-key
    toride-ssh-known-hosts toride-status toride-updates toride-users
    toride-wireguard ufw-kit ufw-kit-test-support
  PORTABLE_CRATES_WINDOWS: >-
    toride-apps toride-audit toride-backup toride-cloud toride-diagnostic-types
    toride-fail2ban toride-fs toride-harden toride-installer toride-mise
    toride-monitor toride-proxy toride-registry toride-runner toride-service
    toride-ssh toride-ssh-agent
    toride-ssh-authorized-keys toride-ssh-certificate toride-ssh-config
    toride-ssh-core toride-ssh-doctor toride-ssh-forward toride-ssh-key
    toride-ssh-known-hosts toride-status toride-updates toride-users
    toride-wireguard ufw-kit ufw-kit-test-support
  # Test execution is narrower than compilation on Windows: the first CI run
  # showed toride-runner/toride-service process tests fail on Windows (they
  # drive Unix process semantics). Grow this list only with green runner
  # evidence.
  PORTABLE_TESTS_WINDOWS: >-
    toride-diagnostic-types toride-mise
  # Every publishable workspace member (no manifest sets publish = false),
  # topologically sorted dependencies-first via cargo metadata --no-deps.
  PUBLISH_ORDER: >-
    toride-diagnostic-types toride-fs toride-runner toride-installer
    toride-registry toride-mise toride-apps toride-service toride-ssh-core
    toride-status toride-audit toride-backup toride-cloud toride-fail2ban
    toride-harden toride-monitor toride-proxy toride-ssh-agent
    toride-ssh-authorized-keys toride-ssh-certificate toride-ssh-config
    toride-ssh-forward toride-ssh-known-hosts toride-tailscale toride-updates
    toride-users toride-wireguard ufw-kit toride-ssh-doctor toride-ssh-key
    ufw-kit-test-support toride-ssh toride

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Lint (workspace on Linux, portable set on macOS/Windows)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            packages=(--workspace)
          else
            packages=()
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              list="$PORTABLE_CRATES_WINDOWS"
            else
              list="$PORTABLE_CRATES_MACOS"
            fi
            for crate in $list; do
              packages+=(-p "$crate")
            done
          fi
          cargo clippy "${packages[@]}" --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Test (workspace on Linux, portable set on macOS/Windows)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            packages=(--workspace)
          else
            packages=()
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              list="$PORTABLE_TESTS_WINDOWS"
            else
              list="$PORTABLE_CRATES_MACOS"
            fi
            for crate in $list; do
              packages+=(-p "$crate")
            done
          fi
          cargo test "${packages[@]}" --all-targets

  toride-apps-features:
    name: toride-apps feature gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: toride-apps-features
      - name: Lint and test the non-default mise feature
        run: |
          cargo clippy -p toride-apps --all-targets --features mise -- -D warnings
          cargo test -p toride-apps --all-targets --features mise
      - name: Check the tokio-free default build
        run: cargo check -p toride-apps --no-default-features

  publish-set-features:
    name: Publish-set feature gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-set-features
      - name: Lint and test the non-default http feature
        run: |
          cargo clippy -p toride-registry -p toride-installer --all-targets --features http -- -D warnings
          cargo test -p toride-registry -p toride-installer --all-targets --features http

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Check (workspace on Linux, portable set on macOS/Windows)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            packages=(--workspace)
          else
            packages=()
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              list="$PORTABLE_CRATES_WINDOWS"
            else
              list="$PORTABLE_CRATES_MACOS"
            fi
            for crate in $list; do
              packages+=(-p "$crate")
            done
          fi
          cargo check "${packages[@]}" --all-targets

  publish-readiness:
    name: Publish readiness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check intra-workspace version requirements match local versions
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json, os, pathlib, sys
          meta = json.loads(pathlib.Path("metadata.json").read_text())
          order = os.environ["PUBLISH_ORDER"].split()
          by_name = {p["name"]: p for p in meta["packages"]}
          members = set(by_name)
          failed = False
          if set(order) != members:
              print("PUBLISH_ORDER membership mismatch:", sorted(set(order) ^ members))
              failed = True
          versions = {p["version"] for p in meta["packages"]}
          if len(versions) != 1:
              print("workspace versions disagree:", {p["name"]: p["version"] for p in meta["packages"]})
              failed = True
          pos = {c: i for i, c in enumerate(order)}
          for name in sorted(members):
              for dep in by_name[name]["dependencies"]:
                  if dep["name"] in members and dep.get("path"):
                      want = f"^{by_name[dep['name']]['version']}"
                      if dep["req"] != want:
                          print(f"{name} requires {dep['name']} {dep['req']!r}, expected {want!r}")
                          failed = True
                      if pos.get(dep["name"], len(order)) > pos.get(name, len(order)):
                          print(f"PUBLISH_ORDER order: {name} precedes its dependency {dep['name']}")
                          failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: cargo publish --dry-run (every publishable crate, dependency order)
        shell: bash
        # Order-blocked dry-runs (an intra-workspace sibling absent from
        # crates.io, or published only at older versions than the local
        # requirement) downgrade to warnings; any other failure fails.
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          order_members="$(printf '%s' "$PUBLISH_ORDER" | tr ' ' '|')"
          for crate in $PUBLISH_ORDER; do
            echo "::group::cargo publish --dry-run -p $crate"
            log="$(mktemp)"
            if ! cargo publish --dry-run -p "$crate" 2>&1 | tee "$log"; then
              if grep -qE "no matching package named \`(${order_members})\` found|failed to select a version for the requirement \`(${order_members}) = " "$log"; then
                echo "::warning::publish dry-run order-blocked for $crate (intra-workspace dep absent from crates.io or published only at older versions than required)"
              else
                echo "::error::publish dry-run failed for $crate"
                exit 1
              fi
            fi
            rm -f "$log"
            echo "::endgroup::"
          done
